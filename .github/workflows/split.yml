name: Split

# Copies packages/* into the read-only repositories quittio/core, quittio/laravel and
# quittio/country-de, -at, -be, -ch and -fr for every push to master and every tag (with the same tag). Called by the
# job "split" of ci.yml once lint, analysis, tests and the official validation passed, so that
# nothing reaches the split repositories and Packagist that failed CI.
# Secret SPLIT_TOKEN: a token with write access to these repositories: "Contents: Read and write" and,
# because every package ships .github/workflows/close-pull-request.yml, "Workflows: Read and write"
# (classic tokens: the scopes repo and workflow). Without it GitHub refuses the push of the split.

on:
  workflow_call:
    secrets:
      SPLIT_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: split-${{ github.ref }}

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [core, laravel, country-de, country-at, country-be, country-ch, country-fr]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          package_directory: packages/${{ matrix.package }}
          repository_organization: Quittio
          repository_name: ${{ matrix.package }}
          branch: master
          user_name: Niklas Forst
          user_email: kontakt@niklasforst.de

      - if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        with:
          tag: ${{ github.ref_name }}
          package_directory: packages/${{ matrix.package }}
          repository_organization: Quittio
          repository_name: ${{ matrix.package }}
          branch: master
          user_name: Niklas Forst
          user_email: kontakt@niklasforst.de
