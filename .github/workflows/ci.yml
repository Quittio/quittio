name: CI

on:
  push:
    branches: [master]
    # Tags run CI too: the split below publishes a tag only after every job passed.
    tags: ['*']
  pull_request:
  # Weekly run of the tests and the official validation: composer.lock is not committed, so
  # new releases of dependencies are caught here before a user installs them.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pushes to master and tags are never cancelled, so that every one of them can be split.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php: '8.4'
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer lint
      - run: composer validate --no-check-publish --no-check-lock --strict
      - run: for p in packages/*/; do composer validate --no-check-publish --no-check-lock --strict --working-dir="$p"; done
      # Known vulnerabilities of the resolved dependencies; abandoned packages are only reported.
      - run: composer audit --no-interaction --abandoned=report

  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php: '8.4'
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer analyse

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: ['highest', 'lowest']
    name: test (PHP ${{ matrix.php }}, Laravel 13, ${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: vendor/bin/pest --exclude-group=official,visual

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php: '8.4'
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: vendor/bin/pest --group=visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: visual-diff
          path: packages/laravel/tests/Visual/__snapshots__/*.actual.png

  official-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php: '8.4'
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath
          coverage: none
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      # The download scripts skip files that exist; their pinned versions and checksums are part
      # of the key, so a new pin downloads (and verifies) again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tools/validators
            packages/country-de/tests/Fixtures/xrechnung-testsuite
          key: validators-${{ hashFiles('tools/schemas/download.sh', 'tools/fixtures/download.sh', 'packages/core/src/Validation/Drivers/KositArtifacts.php') }}
      - run: tools/schemas/download.sh
      - run: tools/fixtures/download.sh
      - run: tools/validate-fixtures.sh
      - run: vendor/bin/pest --group=official

  split:
    needs: [lint, analyse, test, visual, official-validation]
    if: github.event_name == 'push' && github.repository == 'Quittio/quittio'
    uses: ./.github/workflows/split.yml
    secrets:
      SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}

  # quittio/quittio is published from this repository. It has no Packagist webhook, so that a
  # push or tag reaches Packagist only here, after every job passed and the split packages were
  # published. Secrets: PACKAGIST_USERNAME and PACKAGIST_TOKEN (API token of the Packagist profile).
  packagist:
    needs: [split]
    if: github.event_name == 'push' && github.repository == 'Quittio/quittio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update quittio/quittio on Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          if [ -z "$PACKAGIST_USERNAME" ] || [ -z "$PACKAGIST_TOKEN" ]; then
            echo "::error::The secrets PACKAGIST_USERNAME and PACKAGIST_TOKEN are missing."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 -X POST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -d '{"repository":{"url":"https://packagist.org/packages/quittio/quittio"}}'
