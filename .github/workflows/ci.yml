name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer analyse

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: ['highest', 'lowest']
    name: test (PHP ${{ matrix.php }}, Laravel 13, ${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: vendor/bin/pest --exclude-group=official,visual

  visual:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pest --group=visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diff
          path: packages/laravel/tests/Visual/__snapshots__/*.actual.png

  official-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath
          coverage: none
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: composer install --no-interaction --no-progress
      - run: tools/schemas/download.sh
      - run: tools/fixtures/download.sh
      - run: tools/validate-fixtures.sh
      - run: vendor/bin/pest --group=official
