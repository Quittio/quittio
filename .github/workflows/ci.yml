name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: for p in packages/*/; do composer validate --no-check-publish --no-check-lock --strict --working-dir="$p"; done

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer analyse

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: ['highest', 'lowest']
    name: test (PHP ${{ matrix.php }}, Laravel 13, ${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: ramsey/composer-install@4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}
      - run: vendor/bin/pest --exclude-group=official,visual

  managed-databases:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]
        triggers: ['0', '1']
    name: managed (${{ matrix.db }}, triggers ${{ matrix.triggers }})
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: quittio
          MYSQL_USER: quittio
          MYSQL_PASSWORD: quittio
          MYSQL_ROOT_PASSWORD: quittio
        ports: ['33061:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uquittio -pquittio"
          --health-interval 2s --health-timeout 5s --health-retries 30
      pgsql:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quittio
          POSTGRES_USER: quittio
          POSTGRES_PASSWORD: quittio
        ports: ['54321:5432']
        options: >-
          --health-cmd "pg_isready -U quittio"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      QUITTIO_DB: ${{ matrix.db }}
      QUITTIO_DB_TRIGGERS: ${{ matrix.triggers }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath, pdo_mysql, pdo_pgsql, pcntl, posix
          coverage: none
      - name: Allow triggers with binary logging
        if: matrix.db == 'mysql'
        run: mysql -h 127.0.0.1 -P 33061 -uroot -pquittio -e "SET GLOBAL log_bin_trust_function_creators = 1;"
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pest --testsuite=managed

  visual:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pest --group=visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diff
          path: packages/laravel/tests/Visual/__snapshots__/*.actual.png

  official-validation:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: dom, libxml, mbstring, xmlwriter, zlib, intl, gd, bcmath
          coverage: none
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: composer install --no-interaction --no-progress
      - run: tools/schemas/download.sh
      - run: tools/fixtures/download.sh
      - run: tools/validate-fixtures.sh
      - run: vendor/bin/pest --group=official
