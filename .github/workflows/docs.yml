name: Docs

# Builds the documentation website from docs/ (Jekyll, then llms.txt, the Markdown pages and the
# MCP index with _worker/build.mjs) and deploys it to Cloudflare as a Worker with static assets
# and the MCP server under /mcp (docs/wrangler.jsonc).
# Repository secrets: CLOUDFLARE_API_TOKEN (token template "Edit Cloudflare Workers") and
# CLOUDFLARE_ACCOUNT_ID. Repository variable: DOCS_URL, the address of the website
# (e.g. https://docs.quittio.dev), used for absolute links such as the preview image.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: docs
      # Site address, repository link and "Edit this page" from the repository the workflow runs in.
      - run: |
          cat > _config.ci.yml <<CONFIG
          url: "${DOCS_URL}"
          aux_links:
            GitHub:
              - "${REPOSITORY_URL}"
          aux_links_new_tab: true
          gh_edit_link: true
          gh_edit_link_text: Edit this page on GitHub
          gh_edit_repository: "${REPOSITORY_URL}"
          gh_edit_branch: "${GITHUB_REF_NAME}"
          gh_edit_source: docs
          gh_edit_view_mode: edit
          CONFIG
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      - run: bundle exec jekyll build --config _config.yml,_config.ci.yml
        env:
          JEKYLL_ENV: production
      - run: node _worker/build.mjs
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
      - run: node --test _worker/index.test.mjs
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
