name: Docs

# Builds the versioned documentation website (docs/_versioning/build.mjs): the latest release at
# the root, the development version of master under /next/ and older minor versions under /X.Y/,
# each with Jekyll, llms.txt, the Markdown pages, the API reference under api/ (phpDocumentor)
# and, for the root, the MCP index. Tests the MCP
# server, checks the links and anchors of the built site, and deploys it to Cloudflare as a Worker
# with static assets and the MCP server under /mcp (docs/wrangler.jsonc). Pull requests build only
# /next/ and do not deploy. A published release rebuilds the site, so that the root shows it.
# Repository secrets: CLOUDFLARE_API_TOKEN (token template "Edit Cloudflare Workers") and
# CLOUDFLARE_ACCOUNT_ID. Repository variable: DOCS_URL, the address of the website
# (e.g. https://docs.quittio.dev), used for absolute links such as the preview image.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'packages/*/src/**'
      - 'tools/docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deployments run one after the other and are never cancelled; checks of a pull request are
  # replaced by the next push to it.
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ github.event_name == 'pull_request' && 'check' || 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags of the releases; on a release, /next/ is still built from master.
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: docs
      # phpDocumentor builds the API reference of every version (tools/docs/phpdoc.sh, pinned SHA-256).
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - run: ../tools/docs/phpdoc.sh
      # Site address, repository link and "Edit this page" from the repository the workflow runs in.
      - run: |
          cat > _config.ci.yml <<CONFIG
          url: "${DOCS_URL}"
          aux_links:
            GitHub:
              - "${REPOSITORY_URL}"
          aux_links_new_tab: true
          gh_edit_link: true
          gh_edit_link_text: Edit this page on GitHub
          gh_edit_repository: "${REPOSITORY_URL}"
          gh_edit_branch: "${EDIT_BRANCH}"
          gh_edit_source: docs
          gh_edit_view_mode: edit
          CONFIG
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          EDIT_BRANCH: ${{ github.event.repository.default_branch }}
      - run: node _versioning/build.mjs --config _config.ci.yml --api ../build/tools/phpDocumentor.phar ${{ github.event_name == 'pull_request' && '--only-next' || '' }}
        env:
          DOCS_URL: ${{ vars.DOCS_URL }}
          JEKYLL_ENV: production
      - run: node --test _worker/index.test.mjs
      # Links and anchors between the pages of the built site; external links are not checked, so
      # that the build does not depend on other websites.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          workingDirectory: docs/_site
          # The generated API reference (api/) is not checked.
          args: --offline --include-fragments --root-dir ${{ github.workspace }}/docs/_site --exclude-path '(^|/)api/' --no-progress './**/*.html'
          jobSummary: true
          # Outside of _site, which is deployed.
          output: ${{ runner.temp }}/lychee.md
      - if: github.event_name != 'pull_request'
        run: npx --yes wrangler@4.145.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
