# Databases for the Managed test matrix:
#   docker compose -f tools/docker/databases/compose.yaml up -d --wait
#   QUITTIO_DB=mysql vendor/bin/pest --testsuite=managed
#   QUITTIO_DB=pgsql QUITTIO_DB_TRIGGERS=1 vendor/bin/pest --testsuite=managed
name: quittio-databases

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quittio
      MYSQL_USER: quittio
      MYSQL_PASSWORD: quittio
      MYSQL_ROOT_PASSWORD: quittio
    command: ["--log-bin-trust-function-creators=1"]
    ports:
      - "33061:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uquittio", "-pquittio"]
      interval: 2s
      timeout: 5s
      retries: 30

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quittio
      POSTGRES_USER: quittio
      POSTGRES_PASSWORD: quittio
    ports:
      - "54321:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "quittio"]
      interval: 2s
      timeout: 5s
      retries: 30
