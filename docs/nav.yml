# The pages of the documentation on quittio.dev/docs, in navigation order: quittio.dev reads
# their titles and order from here. Every Markdown file in docs/ needs an entry, one per line in
# this form (tests/Monorepo/DocsNavigationTest.php). parent puts a page below another one,
# preview: true marks a page of an unreleased package (on the website, but not in llms.txt or the
# MCP server), optional: true a reference page that AI tools may skip. seo and description are the
# title (up to 60 characters) and the description (up to 160) for search engines, in double quotes;
# without them the website uses the title and the first paragraph of the page.

- { page: index, title: Home, seo: "Quittio documentation: e-invoicing for PHP and Laravel", description: "Documentation of Quittio, the open-source e-invoicing library for PHP and Laravel: ZUGFeRD/Factur-X, XRechnung, UBL and Peppol BIS based on EN 16931." }
