# Documentation website, built by .github/workflows/docs.yml with Jekyll 4 and the theme
# Just the Docs and served by Cloudflare (wrangler.jsonc). The Markdown files in this directory
# stay the only source: they need no front matter, titles and navigation order are set below.
#
# Local preview: cd docs && bundle install && bundle exec jekyll serve

title: Quittio
description: E-invoicing for Laravel – EN 16931, ZUGFeRD/Factur-X, XRechnung, UBL and Peppol BIS.
theme: just-the-docs
color_scheme: quittio
# Brand assets: the logo replaces the title in the header; favicon.ico is linked by the theme,
# favicon.svg and apple-touch-icon.png by _includes/head_custom.html.
logo: /assets/images/quittio-logo.svg
# Open Graph and Twitter preview (jekyll-seo-tag); the CI build sets url for absolute links.
twitter:
  card: summary_large_image

search_enabled: true
search:
  heading_level: 3
  button: true
heading_anchors: true
enable_copy_code_button: true
back_to_top: true
back_to_top_text: Back to top

footer_content: "Quittio – the open core packages are MIT licensed. The legal wording of the country packs must be confirmed by a tax adviser."

plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links

optional_front_matter:
  remove_originals: true

relative_links:
  enabled: true
  collections: false

# Deprecation notices of the theme's stylesheets, not of this site.
sass:
  quiet_deps: true
  silence_deprecations: [import, global-builtin, color-functions]

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
  - _config.ci.yml
  - wrangler.jsonc
  - .wrangler

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image:
        path: /assets/images/og-image.png
        width: 1200
        height: 630
  # Every page below: Blade examples such as {{ $invoice->number }} must not be read as Liquid
  # (the theme's stylesheets still need Liquid, so this is set per page).
  - scope: { path: "index.md" }
    values: { title: Home, nav_order: 1, render_with_liquid: false }
  - scope: { path: "getting-started.md" }
    values: { title: Getting started, nav_order: 2, render_with_liquid: false }
  - scope: { path: "examples.md" }
    values: { title: Examples, nav_order: 3, render_with_liquid: false }
  - scope: { path: "building-invoices.md" }
    values: { title: Building invoices, nav_order: 4, render_with_liquid: false }
  - scope: { path: "formats.md" }
    values: { title: Formats and profiles, nav_order: 5, render_with_liquid: false }
  - scope: { path: "validation.md" }
    values: { title: Validation, nav_order: 6, render_with_liquid: false }
  - scope: { path: "templates.md" }
    values: { title: Templates and design, nav_order: 7, render_with_liquid: false }
  - scope: { path: "documents.md" }
    values: { title: Quotes and other documents, nav_order: 8, render_with_liquid: false }
  - scope: { path: "reading.md" }
    values: { title: Reading incoming invoices, nav_order: 9, render_with_liquid: false }
  - scope: { path: "laravel.md" }
    values: { title: Laravel integration, nav_order: 10, render_with_liquid: false }
  - scope: { path: "configuration.md" }
    values: { title: Configuration, nav_order: 11, render_with_liquid: false }
  - scope: { path: "country-packs.md" }
    values: { title: Country packs, nav_order: 12, render_with_liquid: false }
  - scope: { path: "managed.md" }
    values: { title: Managed layer, nav_order: 13, render_with_liquid: false }
  - scope: { path: "testing.md" }
    values: { title: Testing, nav_order: 14, render_with_liquid: false }
  - scope: { path: "commands.md" }
    values: { title: Artisan commands, nav_order: 15, render_with_liquid: false }
  - scope: { path: "field-reference.md" }
    values: { title: Field reference, nav_order: 16, render_with_liquid: false }
  - scope: { path: "ai.md" }
    values: { title: AI assistants, nav_order: 17, render_with_liquid: false }
